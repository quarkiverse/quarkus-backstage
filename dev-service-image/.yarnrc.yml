nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.18.0.cjs

# Yarn >= 4.14.0 disables dependency build scripts by default. The Backstage
# backend needs native addons (isolated-vm for the scaffolder, better-sqlite3
# for the database), so build scripts must stay enabled or the image starts
# with "Cannot find module './out/isolated_vm'".
enableScripts: true
